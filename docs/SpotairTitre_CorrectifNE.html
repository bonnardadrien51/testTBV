<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>SpotAiR + Pioupiou + Logos</title>

  <!-- Police -->
  <link
    href="https://fonts.googleapis.com/css2?family=Tan+Headline:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       BASE
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;

      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;

      width: 100vw;
      height: 100vh;

      font-family: Arial, sans-serif;

      background: white;

      overflow: hidden;
    }


    /* =========================================================
       STATIONS
       ========================================================= */

    .station {
      display: flex;
      flex-direction: column;

      align-items: center;

      width: 100%;
      height: 100%;

      background: white;

      padding: 4px;

      overflow: hidden;
    }


    .station h1 {
      flex: 0 0 auto;

      width: 100%;

      margin: 4px 0;

      text-align: center;

      font-family: 'Tan Headline', Arial, sans-serif;

      font-size: clamp(18px, 1.5vw, 28px);

      line-height: 1.15;

      font-weight: 700;

      color: #1a1a1a;

      white-space: nowrap;
    }


    iframe {
      width: 100%;
      height: 100%;

      flex: 1 1 auto;

      min-height: 0;

      border: none;
    }


    /* =========================================================
       PANNEAU PLANOISE NE
       ========================================================= */

    .wind-panel {

      width: 100%;
      height: 100%;

      flex: 1 1 auto;

      min-height: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }


    /* =========================================================
       CERCLE
       ========================================================= */

    .wind-display {

      /*
       * Le cercle prend une taille responsive.
       *
       * min() permet de ne jamais dépasser :
       * - la largeur disponible
       * - la hauteur disponible
       *
       * aspect-ratio garantit un vrai cercle.
       */

      width: min(
        28vw,
        28vh,
        280px
      );

      aspect-ratio: 1 / 1;

      flex: 0 1 auto;

      position: relative;

      border-radius: 50%;

      background: #f4f4f4;

      border: clamp(5px, 0.6vw, 8px) solid #444;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /*
     * Cercle vert intérieur
     */

    .wind-display::before {

      content: "";

      position: absolute;

      width: 86%;
      height: 86%;

      aspect-ratio: 1 / 1;

      border-radius: 50%;

      border: clamp(4px, 0.5vw, 7px) solid #39b51c;

      background: white;

      z-index: 1;
    }


    /* =========================================================
       FLECHE
       ========================================================= */

    .wind-arrow {

      position: absolute;

      /*
       * Taille relative au cercle
       */

      width: 9%;
      height: 40%;

      left: 50%;
      top: 8%;

      transform-origin: 50% 100%;

      /*
       * La rotation est modifiée par JavaScript.
       */

      transform:
        translateX(-50%)
        rotate(0deg);

      transition:
        transform 0.8s ease;

      z-index: 3;

      pointer-events: none;
    }


    /*
     * Pointe de la flèche
     */

    .wind-arrow::before {

      content: "";

      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: clamp(12px, 1.8vw, 24px) solid transparent;

      border-right: clamp(12px, 1.8vw, 24px) solid transparent;

      border-bottom: clamp(24px, 3.5vw, 48px) solid #444;
    }


    /*
     * Corps de la flèche
     */

    .wind-arrow::after {

      content: "";

      position: absolute;

      left: 50%;

      top: clamp(20px, 2.7vw, 38px);

      transform: translateX(-50%);

      width: clamp(6px, 0.7vw, 10px);

      height: calc(100% - clamp(20px, 2.7vw, 38px));

      background: #444;

      border-radius: 5px;
    }


    /* =========================================================
       CONTENU CENTRAL DU CERCLE
       ========================================================= */

    .wind-speed {

      position: relative;

      z-index: 10;

      width: 70%;

      height: 70%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      line-height: 1;
    }


    /*
     * Valeur de vitesse
     */

    .wind-speed-value {

      font-size: clamp(
        48px,
        6vw,
        92px
      );

      line-height: 0.95;

      font-weight: 700;

      color: #39b51c;

      white-space: nowrap;
    }


    /*
     * km/h
     *
     * Reste volontairement dans le cercle.
     */

    .wind-speed-unit {

      margin-top: clamp(
        3px,
        0.5vw,
        8px
      );

      font-size: clamp(
        14px,
        1.4vw,
        22px
      );

      line-height: 1;

      font-weight: 700;

      color: #455a64;

      white-space: nowrap;
    }


    /* =========================================================
       MIN / MOY / MAX
       ========================================================= */

    .wind-values {

      margin-top: clamp(
        8px,
        1.5vh,
        20px
      );

      display: flex;

      align-items: baseline;

      justify-content: center;

      gap: 4px;

      font-size: clamp(
        28px,
        3vw,
        50px
      );

      line-height: 1;

      font-weight: 700;

      white-space: nowrap;
    }


    .wind-min {
      color: #455a64;
    }


    .wind-avg {
      color: #39a51c;
    }


    .wind-max {
      color: #455a64;
    }


    .wind-separator {
      color: #777;
    }


    /* =========================================================
       DIRECTION
       ========================================================= */

    .wind-direction {

      margin-top: clamp(
        5px,
        0.6vh,
        10px
      );

      font-size: clamp(
        12px,
        1.1vw,
        17px
      );

      line-height: 1.2;

      font-weight: 600;

      color: #444;

      text-align: center;
    }


    /* =========================================================
       STATUT
       ========================================================= */

    .wind-info {

      margin-top: clamp(
        4px,
        0.6vh,
        8px
      );

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      font-size: clamp(
        11px,
        0.9vw,
        14px
      );

      color: #777;

      white-space: nowrap;
    }


    .wind-status {

      display: flex;

      align-items: center;

      gap: 5px;
    }


    .status-dot {

      width: 9px;
      height: 9px;

      flex: 0 0 9px;

      border-radius: 50%;

      background: #39b51c;
    }


    .status-offline {
      background: #d32f2f;
    }


    /* =========================================================
       LOGOS
       ========================================================= */

    .logos {

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      width: 100%;
      height: 100%;

      background: white;

      padding: 10px;

      overflow: hidden;
    }


    .logos img {

      width: 100%;

      max-width: 80%;

      flex: 1 1 0;

      min-height: 0;

      object-fit: contain;

      margin: 6px 0;
    }


    /* =========================================================
       PETITS ECRANS
       ========================================================= */

    @media (max-width: 700px) {

      .wind-display {

        width: min(
          30vw,
          30vh,
          220px
        );
      }

      .wind-values {
        font-size: clamp(
          22px,
          4vw,
          36px
        );
      }

      .wind-info {
        font-size: 10px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================================================
       CASE 1 : BESANÇON PLANOISE NE
       ========================================================= -->

  <div class="station">

    <h1>Besançon Planoise NE</h1>

    <div class="wind-panel">


      <!-- ===============================
           INDICATEUR VENT
           =============================== -->

      <div class="wind-display">


        <!-- Flèche -->

        <div
          id="windArrow"
          class="wind-arrow">
        </div>


        <!-- Vitesse -->

        <div class="wind-speed">

          <div
            id="windSpeed"
            class="wind-speed-value">
            --
          </div>

          <div class="wind-speed-unit">
            km/h
          </div>

        </div>

      </div>


      <!-- ===============================
           MIN / MOY / MAX
           =============================== -->

      <div class="wind-values">

        <span
          id="windMin"
          class="wind-min">
          --
        </span>

        <span class="wind-separator">
          /
        </span>

        <span
          id="windAvg"
          class="wind-avg">
          --
        </span>

        <span class="wind-separator">
          /
        </span>

        <span
          id="windMax"
          class="wind-max">
          --
        </span>

      </div>


      <!-- ===============================
           DIRECTION
           =============================== -->

      <div
        id="windDirection"
        class="wind-direction">

        Direction : --

      </div>


      <!-- ===============================
           STATUT
           =============================== -->

      <div class="wind-info">

        <div class="wind-status">

          <span
            id="statusDot"
            class="status-dot">
          </span>

          <span id="windStatus">
            Connexion...
          </span>

        </div>

        <span id="windUpdated">
          --
        </span>

      </div>

    </div>

  </div>



  <!-- =========================================================
       CASE 2 : BESANÇON PLANOISE SO
       ========================================================= -->

  <div class="station">

    <h1>Besançon Planoise SO</h1>

    <iframe
      src="https://www.spotair.mobi/widget/wind/ffvl/2195?unit=kmh&name=false">
    </iframe>

  </div>



  <!-- =========================================================
       CASE 3 : BESANÇON ARGUEL N
       ========================================================= -->

  <div class="station">

    <h1>Besançon Arguel N</h1>

    <iframe
      src="https://www.spotair.mobi/widget/wind/ffvl/5043?unit=kmh&name=false">
    </iframe>

  </div>



  <!-- =========================================================
       CASE 4 : LOGOS
       ========================================================= -->

  <div class="logos">

    <img
      src="https://besancon-vol-libre.fr/wp-content/uploads/2023/01/logoBVL-2-e1673386260565.png"
      alt="Logo BVL">

    <img
      src="https://www.letabliludique.fr/wp-content/uploads/2025/04/Group-1.svg"
      alt="Logo L'Établi Ludique">

  </div>



  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    /*
     * API Pioupiou
     */

    const API_URL =
      "https://api.pioupiou.fr/v1/live/2212";


    /*
     * Actualisation toutes les 60 secondes
     */

    const REFRESH_INTERVAL =
      60000;


    /*
     * Conversion degrés -> direction
     */

    function getDirection(degrees) {

      const directions = [
        "N",
        "NE",
        "E",
        "SE",
        "S",
        "SO",
        "O",
        "NO"
      ];

      const index =
        Math.round(degrees / 45) % 8;

      return directions[index];
    }


    /*
     * Formatage de l'heure
     */

    function formatDate(dateString) {

      const date =
        new Date(dateString);

      if (
        isNaN(
          date.getTime()
        )
      ) {
        return "--";
      }

      return date.toLocaleTimeString(
        "fr-FR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    /*
     * Récupération des données
     */

    async function updateWind() {

      const status =
        document.getElementById(
          "windStatus"
        );

      const statusDot =
        document.getElementById(
          "statusDot"
        );


      try {

        /*
         * On évite le cache navigateur
         */

        const response =
          await fetch(
            API_URL +
            "?_=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Erreur HTTP " +
            response.status
          );

        }


        const json =
          await response.json();


        const data =
          json.data;


        const measurements =
          data.measurements;


        const windStatus =
          data.status;


        /*
         * Valeurs brutes
         */

        const heading =
          Number(
            measurements.wind_heading
          );


        const avg =
          Number(
            measurements.wind_speed_avg
          );


        const min =
          Number(
            measurements.wind_speed_min
          );


        const max =
          Number(
            measurements.wind_speed_max
          );


        /*
         * ===============================
         * VITESSE PRINCIPALE
         * ===============================
         */

        document.getElementById(
          "windSpeed"
        ).textContent =
          avg
            .toFixed(1)
            .replace(".", ",");


        /*
         * ===============================
         * MIN / MOY / MAX
         * ===============================
         */

        document.getElementById(
          "windMin"
        ).textContent =
          min.toFixed(0);


        document.getElementById(
          "windAvg"
        ).textContent =
          avg.toFixed(0);


        document.getElementById(
          "windMax"
        ).textContent =
          max.toFixed(0);


        /*
         * ===============================
         * ORIENTATION
         *
         * IMPORTANT :
         *
         * On ajoute 180° à la direction
         * fournie par Pioupiou.
         * ===============================
         */

        const correctedHeading =
          (heading + 180) % 360;


        document.getElementById(
          "windArrow"
        ).style.transform =
          "translateX(-50%) rotate(" +
          correctedHeading +
          "deg)";


        /*
         * ===============================
         * DIRECTION AFFICHÉE
         *
         * On conserve la direction réelle
         * du vent fournie par la balise.
         * ===============================
         */

        const direction =
          getDirection(heading);


        document.getElementById(
          "windDirection"
        ).textContent =
          "Direction : " +
          direction +
          " (" +
          Math.round(heading) +
          "°)";


        /*
         * ===============================
         * STATUT
         * ===============================
         */

        const online =
          windStatus &&
          windStatus.state === "on";


        if (online) {

          status.textContent =
            "En ligne";

          statusDot.classList.remove(
            "status-offline"
          );

        } else {

          status.textContent =
            "Hors ligne";

          statusDot.classList.add(
            "status-offline"
          );

        }


        /*
         * ===============================
         * DERNIÈRE MESURE
         * ===============================
         */

        document.getElementById(
          "windUpdated"
        ).textContent =
          "Mesure : " +
          formatDate(
            measurements.date
          );

      }


      catch (error) {

        console.error(
          "Erreur récupération vent :",
          error
        );


        status.textContent =
          "Données indisponibles";


        statusDot.classList.add(
          "status-offline"
        );


        document.getElementById(
          "windUpdated"
        ).textContent =
          "Erreur de connexion";

      }

    }


    /*
     * Première récupération
     */

    updateWind();


    /*
     * Actualisation automatique
     */

    setInterval(
      updateWind,
      REFRESH_INTERVAL
    );

  </script>

</body>
</html>
