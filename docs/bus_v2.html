<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prochains Départs — Velotte, Port Douvot & Malcombe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f2933 0%, #2d3b45 100%);
      min-height: 100vh;
      padding: 40px 16px;
      color: #1f2933;
    }
    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
      color: #f5f7fa;
    }
    .header h1 {
      margin: 0 0 6px 0;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }
    #clock {
      font-size: 1.1rem;
      font-weight: 600;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
    }
    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .top-sections {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }
    .card h2 {
      text-align: center;
      margin: 0 0 16px 0;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #10151a;
    }
    .departure {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: #f6f8fa;
      border-radius: 12px;
    }
    .departure:last-child {
      margin-bottom: 0;
    }
    .line {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .info h3 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .info p {
      margin: 2px 0 0;
      color: #6b7280;
      font-size: 0.82rem;
    }
    .tram-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .column h3 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 0.85rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .error-msg {
      color: #d64545;
      font-size: 0.85rem;
      text-align: center;
    }
    .footer {
      text-align: center;
      margin-top: 22px;
      color: #cbd2d9;
      font-size: 0.75rem;
    }
    .footer-logos {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      padding: 14px 24px;
    }
    .footer-logos img {
      height: 60px;
      width: auto;
      opacity: 0.95;
    }
    .footer-logos img.logo-etabli {
      height: 100px;
    }
    @media (max-width: 650px) {
      body { padding: 24px 10px; }
      .header h1 { font-size: 1.4rem; }
      .top-sections { grid-template-columns: 1fr; }
      .tram-columns { grid-template-columns: 1fr; }
      .footer-logos { flex-direction: column; gap: 10px; padding: 12px 18px; }
      .footer-logos img.logo-etabli { height: 70px; }
      .footer-logos img { height: 42px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>🚌 Prochains départs</h1>
      <div id="clock">--:--:--</div>
    </div>

    <main>
      <div class="top-sections">
        <div class="card">
          <h2>Velotte → Tilleroyes (Ligne 9)</h2>
          <div id="busVelotte">Chargement…</div>
        </div>

        <div class="card">
          <h2>Port Douvot (Ligne 21)</h2>
          <div id="busPortdouvot">Chargement…</div>
        </div>
      </div>

      <div class="card">
        <h2>Tram Malcombe</h2>
        <div class="tram-columns">
          <div class="column">
            <h3>Vers Hauts-du-Chazal</h3>
            <div id="tramChazal">Chargement…</div>
          </div>
          <div class="column">
            <h3>Vers Chalezeule</h3>
            <div id="tramChalezeule">Chargement…</div>
          </div>
        </div>
      </div>
    </main>

    <p class="footer">L'établi ludique — Besançon Vol Libre</p>
    <div class="footer-logos">
      <img class="logo-etabli" src="logo_etabli.png" alt="Logo L'Établi Ludique">
      <img src="logo_bvl.png" alt="Logo Besançon Vol Libre">
    </div>
  </div>

  <script>
    const API_KEY = "EET6d898iS4NSYZ4xazw9m7s6";

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("clock").textContent = `${h}:${m}:${s}`;
    }

    async function fetchBusStop(stopName, containerId) {
      const url = `https://api.ginko.voyage/TR/getTempsLieu.do?apiKey=${API_KEY}&nom=${stopName}&nb=5`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const list = data.objets.listeTemps;
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        list.slice(0, 2).forEach(item => {
          const div = document.createElement("div");
          div.className = "departure";

          const line = document.createElement("div");
          line.className = "line";
          line.style.background = "#" + item.couleurFond;
          line.style.color = "#" + item.couleurTexte;
          line.textContent = item.numLignePublic;

          const info = document.createElement("div");
          info.className = "info";
          info.innerHTML = `
            <h3>${item.destination}</h3>
            <p>Départ : ${item.temps}</p>
          `;

          div.appendChild(line);
          div.appendChild(info);
          container.appendChild(div);
        });
      } catch (e) {
        document.getElementById(containerId).innerHTML = "<p class='error-msg'>Erreur de chargement.</p>";
        console.error(e);
      }
    }

    async function fetchTrams() {
      const url = `https://api.ginko.voyage/TR/getTempsLieu.do?apiKey=${API_KEY}&nom=malcombe&nb=5`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const list = data.objets.listeTemps;
        const chazal = document.getElementById("tramChazal");
        const chalez = document.getElementById("tramChalezeule");

        chazal.innerHTML = "";
        chalez.innerHTML = "";

        list.forEach(item => {
          const div = document.createElement("div");
          div.className = "departure";

          const line = document.createElement("div");
          line.className = "line";
          line.style.background = "#" + item.couleurFond;
          line.style.color = "#" + item.couleurTexte;
          line.textContent = item.numLignePublic;

          const info = document.createElement("div");
          info.className = "info";
          info.innerHTML = `
            <h3>Vers ${item.destination}</h3>
            <p>Départ : ${item.temps}</p>
          `;

          div.appendChild(line);
          div.appendChild(info);

          const dest = item.destination.toLowerCase();
          if (dest.includes("chazal")) {
            chazal.appendChild(div);
          } else if (dest.includes("chalezeule")) {
            chalez.appendChild(div);
          }
        });
      } catch (e) {
        document.getElementById("tramChazal").innerHTML = "<p class='error-msg'>Erreur de chargement.</p>";
        document.getElementById("tramChalezeule").innerHTML = "<p class='error-msg'>Erreur de chargement.</p>";
        console.error(e);
      }
    }

    function refreshAll() {
      updateClock();
      fetchBusStop("velotte", "busVelotte");
      fetchBusStop("portdouvot", "busPortdouvot");
      fetchTrams();
    }

    refreshAll();
    setInterval(refreshAll, 30000); // rafraîchit toutes les 30s
    setInterval(updateClock, 1000); // met l'heure à jour chaque seconde
  </script>
</body>
</html>
