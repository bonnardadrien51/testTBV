<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nos partenaires — Écran</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    h1 {
      flex: 0 0 auto;
      margin: 0;
      padding: 24px 20px 16px;
      text-align: center;
      color: #1a1a1a;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
    }

    /*
      Zone principale des logos
    */
    .grid {
      flex: 1 1 auto;

      display: grid;

      /*
        Les colonnes sont calculées automatiquement
        par JavaScript selon le nombre de logos.
      */
      grid-template-columns: repeat(var(--columns, 4), 1fr);

      /*
        Même principe pour les lignes.
      */
      grid-template-rows: repeat(var(--rows, 2), 1fr);

      gap: clamp(15px, 2vw, 35px);

      padding: 10px 50px 40px;

      width: 100%;
      min-height: 0;
    }

    /*
      Chaque logo est centré dans sa case.
    */
    .logo-container {
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      display: block;

      /*
        Le logo ne dépasse jamais de sa case.
      */
      max-width: 90%;
      max-height: 90%;

      width: auto;
      height: auto;

      object-fit: contain;
    }

    /*
      Message lorsqu'il n'y a aucun logo.
    */
    .empty {
      color: #888;
      font-size: 1.3em;
      text-align: center;

      grid-column: 1 / -1;
      grid-row: 1 / -1;

      align-self: center;
      justify-self: center;
    }

    /*
      Petit indicateur de page.
    */
    .page-indicator {
      position: fixed;
      bottom: 12px;
      right: 20px;

      font-size: 0.9rem;
      color: #999;

      opacity: 0.7;
    }

    /*
      Animation douce lors du changement de page.
    */
    .grid.fade-out {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .grid.fade-in {
      opacity: 1;
      transition: opacity 0.4s ease;
    }
  </style>
</head>

<body>

  <h1>Nos partenaires</h1>

  <div class="grid" id="logos">
    <p class="empty">Chargement des logos…</p>
  </div>

  <div class="page-indicator" id="pageIndicator"></div>

  <script>

    /*
      ============================================================
      CONFIGURATION
      ============================================================
    */

    // Dossier contenant les logos
    const FOLDER = "partenaires";

    // Temps d'affichage de chaque page
    // 8 secondes
    const PAGE_DURATION = 8000;

    // Recharge complète de la page toutes les 24 heures
    const REFRESH_MS = 24 * 60 * 60 * 1000;


    /*
      ============================================================
      VARIABLES
      ============================================================
    */

    let allLogos = [];

    let currentPage = 0;

    let totalPages = 1;

    let pageTimer = null;


    /*
      ============================================================
      CALCUL DU NOMBRE DE LOGOS À AFFICHER
      ============================================================
    */

    function getDisplayConfiguration() {

      /*
        Dimensions disponibles pour les logos.
      */
      const width = window.innerWidth;
      const height = window.innerHeight;

      /*
        On estime la place nécessaire pour un logo.

        Ces valeurs permettent d'avoir des logos suffisamment
        grands sur un écran TV.
      */
      let columns;
      let rows;

      /*
        Écran très large
      */
      if (width >= 1800) {

        columns = 5;
        rows = 3;

      }

      /*
        Écran standard Full HD
      */
      else if (width >= 1200) {

        columns = 4;
        rows = 3;

      }

      /*
        Petit écran
      */
      else {

        columns = 3;
        rows = 3;

      }

      /*
        Adaptation verticale.
      */
      if (height < 700) {
        rows = 2;
      }

      else if (height > 1200) {
        rows += 1;
      }

      return {
        columns,
        rows,
        perPage: columns * rows
      };
    }


    /*
      ============================================================
      AFFICHAGE D'UNE PAGE
      ============================================================
    */

    function displayPage(pageNumber) {

      const container = document.getElementById("logos");
      const indicator = document.getElementById("pageIndicator");

      const config = getDisplayConfiguration();

      /*
        Calcul du nombre total de pages.
      */
      totalPages = Math.ceil(
        allLogos.length / config.perPage
      );

      /*
        Sécurité.
      */
      if (totalPages < 1) {
        totalPages = 1;
      }

      /*
        Si la fenêtre a changé de taille et que la page
        actuelle n'existe plus.
      */
      if (pageNumber >= totalPages) {
        pageNumber = 0;
      }

      currentPage = pageNumber;

      /*
        Logos correspondant à cette page.
      */
      const start = currentPage * config.perPage;

      const end = start + config.perPage;

      const pageLogos = allLogos.slice(start, end);


      /*
        Configuration CSS de la grille.
      */
      container.style.setProperty(
        "--columns",
        config.columns
      );

      container.style.setProperty(
        "--rows",
        config.rows
      );


      /*
        Animation de sortie.
      */
      container.classList.remove("fade-in");

      container.classList.add("fade-out");


      setTimeout(() => {

        container.innerHTML = "";


        /*
          Création des logos.
        */
        pageLogos.forEach((name) => {

          const wrapper = document.createElement("div");

          wrapper.className = "logo-container";


          const img = document.createElement("img");

          img.src =
            `${FOLDER}/${encodeURIComponent(name)}`;

          img.alt =
            name.replace(/\.[^.]+$/, "");


          /*
            Si un logo ne peut pas être chargé,
            on supprime simplement sa case.
          */
          img.onerror = function () {
            wrapper.remove();
          };


          wrapper.appendChild(img);

          container.appendChild(wrapper);

        });


        /*
          Mise à jour de l'indicateur.
        */
        if (totalPages > 1) {

          indicator.textContent =
            `${currentPage + 1} / ${totalPages}`;

        } else {

          indicator.textContent = "";

        }


        /*
          Animation d'entrée.
        */
        requestAnimationFrame(() => {

          container.classList.remove("fade-out");

          container.classList.add("fade-in");

        });

      }, 400);
    }


    /*
      ============================================================
      PASSAGE À LA PAGE SUIVANTE
      ============================================================
    */

    function nextPage() {

      if (totalPages <= 1) {
        return;
      }

      const next =
        (currentPage + 1) % totalPages;

      displayPage(next);
    }


    /*
      ============================================================
      CHARGEMENT DU MANIFEST
      ============================================================
    */

    async function loadLogos() {

      const container =
        document.getElementById("logos");

      try {

        /*
          On ajoute un timestamp pour éviter que GitHub Pages
          conserve une ancienne version du manifest.
        */
        const res = await fetch(
          `${FOLDER}/manifest.json?t=${Date.now()}`
        );


        if (!res.ok) {

          throw new Error(
            "manifest.json introuvable"
          );

        }


        const files = await res.json();


        /*
          Vérification du contenu.
        */
        if (
          !Array.isArray(files) ||
          files.length === 0
        ) {

          container.innerHTML = `
            <p class="empty">
              Aucun logo trouvé dans le dossier "${FOLDER}".
            </p>
          `;

          return;
        }


        /*
          On conserve la liste complète.
        */
        allLogos = files;


        /*
          Première page.
        */
        displayPage(0);


        /*
          Si plusieurs pages existent,
          on lance le défilement automatique.
        */
        if (pageTimer) {
          clearInterval(pageTimer);
        }

        pageTimer = setInterval(
          nextPage,
          PAGE_DURATION
        );


      } catch (err) {

        console.error(err);

        container.innerHTML = `
          <p class="empty">
            Erreur de chargement des logos.
          </p>
        `;

      }
    }


    /*
      ============================================================
      ADAPTATION À LA TAILLE DE L'ÉCRAN
      ============================================================
    */

    let resizeTimer = null;

    window.addEventListener("resize", () => {

      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {

        if (allLogos.length > 0) {

          /*
            On recalcule la répartition.
          */
          displayPage(currentPage);

        }

      }, 250);

    });


    /*
      ============================================================
      INITIALISATION
      ============================================================
    */

    loadLogos();


    /*
      Recharge automatiquement la page toutes les 24 heures
      afin de récupérer les éventuels nouveaux partenaires.
    */
    setTimeout(() => {

      window.location.reload();

    }, REFRESH_MS);

  </script>

</body>
</html>
