
    <html>
    <head>
        <title>Classement — Pilotes</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: 'Poppins', sans-serif;
                background: linear-gradient(135deg, #1f2933 0%, #2d3b45 100%);
                min-height: 100vh;
                padding: 24px 32px;
                color: #1f2933;
            }
            .header {
                text-align: center;
                margin-bottom: 20px;
                color: #f5f7fa;
            }
            .header h1 {
                margin: 0 0 4px 0;
                font-weight: 700;
                font-size: 1.6rem;
                letter-spacing: 0.5px;
            }
            .header p {
                margin: 0;
                font-size: 0.78rem;
                opacity: 0.7;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
                max-width: 1500px;
                margin: 0 auto;
            }
            .pilot-card {
                background: #ffffff;
                border-radius: 12px;
                padding: 10px 8px;
                text-align: center;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
                aspect-ratio: 1 / 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                position: relative;
            }
            .pilot-card.pos-1 { background: linear-gradient(160deg, #fff8e1, #ffffff); }
            .pilot-card.pos-2 { background: linear-gradient(160deg, #f3f4f6, #ffffff); }
            .pilot-card.pos-3 { background: linear-gradient(160deg, #fdece0, #ffffff); }
            .pilot-rank {
                position: absolute;
                top: 6px;
                left: 8px;
                font-size: 0.68rem;
                font-weight: 700;
                color: #9aa5b1;
            }
            .pilot-name {
                font-weight: 600;
                font-size: 0.8rem;
                line-height: 1.15;
                margin-top: 8px;
            }
            .pilot-club {
                font-size: 0.68rem;
                color: #6b7280;
                line-height: 1.15;
            }
            .pilot-score {
                font-weight: 700;
                font-size: 0.95rem;
                color: #10151a;
            }
            .pilot-nb {
                font-size: 0.65rem;
                color: #9aa5b1;
            }
            .badge {
                display: inline-block;
                padding: 1px 8px;
                border-radius: 999px;
                font-size: 0.6rem;
                font-weight: 600;
            }
            .badge-homme { background: #e3f2ed; color: #1e7a5f; }
            .badge-femme { background: #eaf1fb; color: #245c9c; }
            .badge-autre { background: #f1f1f1; color: #666; }
            .footer {
                text-align: center;
                margin-top: 22px;
                color: #cbd2d9;
                font-size: 0.75rem;
            }
            .footer-logos {
                margin-top: 16px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 24px;
                background: rgba(255, 255, 255, 0.92);
                border-radius: 14px;
                padding: 12px 24px;
                max-width: 320px;
                margin-left: auto;
                margin-right: auto;
            }
            .footer-logos img {
                height: 50px;
                width: auto;
                opacity: 0.95;
            }
            .footer-logos img.logo-etabli {
                height: 80px;
            }
            @media (max-width: 700px) {
                body {
                    padding: 16px 12px;
                }
                .header h1 {
                    font-size: 1.25rem;
                }
                .grid {
                    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                    gap: 8px;
                }
                .pilot-name {
                    font-size: 0.72rem;
                }
                .pilot-club, .pilot-nb {
                    font-size: 0.6rem;
                }
                .pilot-score {
                    font-size: 0.85rem;
                }
                .footer-logos {
                    flex-direction: column;
                    gap: 8px;
                }
                .footer-logos img.logo-etabli {
                    height: 60px;
                }
                .footer-logos img {
                    height: 36px;
                }
            }
        </style>
        <script>
            setTimeout(function() {
                window.location.reload();
            }, 300000);
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Classement — Pilotes</h1>
            <p>Généré le 08/08/2026 02:04:01 (heure de Paris)</p>
        </div>
        <div class="grid">
    
        </div>
        <p class="footer">Classement généré par L'établi ludique</p>
        <div class="footer-logos">
            <img class="logo-etabli" src="logo_etabli.png" alt="Logo L'Établi Ludique">
            <img src="logo_bvl.png" alt="Logo Besançon Vol Libre">
        </div>
    </body>
    </html>
